<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>OpenToken — Free AI Chat & Assistant</title>

    <meta
      name="description"
      content="OpenToken is a free and simple AI assistant for answering questions, brainstorming ideas, explaining topics, writing, and everyday tasks."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="googlebot"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://opentoken.website/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="OpenToken"
    />

    <meta
      property="og:title"
      content="OpenToken — Free AI Chat & Assistant"
    />

    <meta
      property="og:description"
      content="OpenToken is a free and simple AI assistant for questions, brainstorming, explanations, writing, and everyday tasks."
    />

    <meta
      property="og:url"
      content="https://opentoken.website/"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="OpenToken — Free AI Chat & Assistant"
    />

    <meta
      name="twitter:description"
      content="OpenToken is a free and simple AI assistant for questions, brainstorming, explanations, writing, and everyday tasks."
    />

    <!-- Browser -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OpenToken",
        "url": "https://opentoken.website/",
        "description": "OpenToken is a free and simple AI assistant for answering questions, brainstorming ideas, explaining topics, writing, and everyday tasks.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
